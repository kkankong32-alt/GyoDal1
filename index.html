            "공문·연수 자료에서 각종 회의록까지 자동 완성", // 9
            "생활기록부 & 학생 상담 기록 정리", // 10
            "가정통신문·안내문·계획서 자동 생성", // 11
            "노트북LM으로 학급 경영 손쉽게 하기", // 12
            "교사 연구·자기계발에 노트북LM 활용하기", // 13
            "노트북LM과 확장프로그램 연동하기", // 14
            "구글 AI 생태계 연동 마스터", // 15
            "AI 윤리와 디지털 시민교육" // 16
        ];

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initSidebar();
            
            // 첫 번째 데이터가 있는 챕터 자동 선택
            const activeChapters = [...new Set(promptData.map(item => item.chapter))].sort((a, b) => a - b);
            if (activeChapters.length > 0) {
                selectChapter(activeChapters[0]);
            }

            // 검색 이벤트 바인딩
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearchBtn');
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                clearBtn.classList.toggle('hidden', query.length === 0);
                if (query) {
                    performSearch(query);
                } else if (isSearching) {
                    // 검색어 지우면 원래 챕터로 복귀
                    isSearching = false;
                    selectChapter(currentChapter);
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
                searchInput.focus();
                isSearching = false;
                selectChapter(currentChapter || activeChapters[0]);
            });

            document.getElementById('viewAllBtn').addEventListener('click', () => {
                isSearching = false;
                currentChapter = 'all';
                updateSidebarUI();
                renderContent(promptData, "전체 챕터 보기");
            });
        });

        // 사이드바 생성
        function initSidebar() {
            const list = document.getElementById('chapterList');
            const activeChapters = new Set(promptData.map(item => item.chapter));

            for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
                const hasData = activeChapters.has(i);
                // 텍스트가 잘리지 않고 전체 보이도록 설정 (min-w-0 flex-1, flex items-start, break-keep 등 적용)
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3.5 rounded-lg text-sm transition-all duration-300 flex items-start justify-between flex-shrink-0 group ${hasData ? 'cursor-pointer hover:bg-white/5 text-netflix-light hover:text-white' : 'cursor-not-allowed text-gray-600 opacity-50'}`;
                btn.id = `nav-ch-${i}`;
                
                let innerHTML = `
                    <div class="flex flex-col min-w-0 flex-1 pr-3 text-left">
                        <span class="text-[10px] font-black tracking-widest mb-1.5 ${hasData ? 'text-netflix-red' : 'text-gray-600'}">CHAPTER ${String(i).padStart(2, '0')}</span>
                        <span class="font-medium text-wrap break-keep leading-snug tracking-wide">${chapterTitles[i-1]}</span>
                    </div>
                `;
                if (!hasData) {
                    // 챕터 1은 아예 프롬프트가 없으므로 '프롬프트 없음' 명시
                    const emptyBadgeText = (i === 1) ? '프롬프트 없음' : '준비 중';
                    innerHTML += `<span class="mt-1 text-[10px] font-bold bg-gray-900 border border-gray-700/50 text-gray-500 px-2 py-0.5 rounded-full whitespace-nowrap flex-shrink-0 shadow-inner">${emptyBadgeText}</span>`;
                }
                btn.innerHTML = innerHTML;

                if (hasData) {
                    btn.addEventListener('click', () => {
                        // 검색 중 클릭 시 검색 취소
                        if (isSearching) {
                            document.getElementById('searchInput').value = '';
                            document.getElementById('clearSearchBtn').classList.add('hidden');
                            isSearching = false;
                        }
                        selectChapter(i);
                    });
                }
                list.appendChild(btn);
            }
        }

        // 챕터 선택
        function selectChapter(chapterNum) {
            currentChapter = chapterNum;
            updateSidebarUI();
            
            const filteredData = promptData.filter(item => item.chapter === chapterNum);
            const titlePrefix = `Chapter ${String(chapterNum).padStart(2, '0')}. `;
            const titleContent = chapterTitles[chapterNum-1];
            const chapterTitle = filteredData.length > 0 ? `${titlePrefix}${titleContent}` : '데이터 없음';
            
            renderContent(filteredData, chapterTitle);
        }

        // 사이드바 UI 업데이트 (선택 상태 표시)
        function updateSidebarUI() {
            for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
                const btn = document.getElementById(`nav-ch-${i}`);
                if (btn) {
                    if (currentChapter === i && !isSearching) {
                        btn.classList.add('bg-gradient-to-r', 'from-netflix-red/20', 'to-transparent', 'border-l-[3px]', 'border-netflix-red', 'text-white');
                        btn.classList.remove('text-netflix-light', 'hover:bg-white/5');
                        // 모바일 스크롤 중앙 정렬
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        btn.classList.remove('bg-gradient-to-r', 'from-netflix-red/20', 'to-transparent', 'border-l-[3px]', 'border-netflix-red', 'text-white');
                        if (!btn.classList.contains('cursor-not-allowed')) {
                            btn.classList.add('text-netflix-light', 'hover:bg-white/5');
                        }
                    }
                }
            }
        }

        // 검색 실행
        function performSearch(query) {
            isSearching = true;
            updateSidebarUI(); // 사이드바 하이라이트 해제
            
            const lowerQuery = query.toLowerCase();
            const results = promptData.filter(item => {
                return item.title.toLowerCase().includes(lowerQuery) || 
                       item.context.toLowerCase().includes(lowerQuery) || 
                       item.prompt.toLowerCase().includes(lowerQuery) ||
                       item.section.toLowerCase().includes(lowerQuery) ||
                       item.chapterTitle.toLowerCase().includes(lowerQuery);
            });

            renderContent(results, `검색 결과: "${query}"`, query);
        }

        // 하이라이트 처리 함수
        function highlightText(text, query) {
            if (!query) return text;
            
            const escapeHTML = (str) => str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
            );

            const escapedText = escapeHTML(text);
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            
            return escapedText.replace(regex, '<mark>$1</mark>');
        }

        // 메인 콘텐츠 렌더링
        function renderContent(data, mainTitle, searchQuery = '') {
            const container = document.getElementById('contentContainer');
            const statusBox = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            
            container.innerHTML = ''; // 초기화

            // 상태 메시지 처리
            if (isSearching) {
                statusBox.classList.remove('hidden');
                if (data.length === 0) {
                    statusBox.classList.add('border-netflix-red', 'text-netflix-red');
                    statusBox.classList.remove('border-gray-800', 'text-white');
                    statusText.innerHTML = `<strong>'${searchQuery}'</strong>에 대한 검색 결과가 없습니다.`;
                    return;
                } else {
                    statusBox.classList.add('border-gray-800', 'text-white');
                    statusBox.classList.remove('border-netflix-red', 'text-netflix-red');
                    statusText.innerHTML = `<strong>'${searchQuery}'</strong> 검색 결과: 총 <strong>${data.length}</strong>개의 프롬프트`;
                }
            } else {
                statusBox.classList.add('hidden');
            }

            if (data.length === 0) return;

            // 타이틀 렌더링
            const titleHtml = `<h2 class="text-2xl font-black text-white border-b border-gray-800/80 pb-4 mb-8 flex items-center gap-3 tracking-tight"><i data-lucide="${isSearching ? 'search' : 'sparkles'}" class="w-6 h-6 text-netflix-red"></i> ${mainTitle}</h2>`;
            container.insertAdjacentHTML('beforeend', titleHtml);

            // 챕터별로 명확하게 보이도록 "전체보기"나 "검색" 시 섹션 제목에 챕터명을 포함
            const isAllOrSearch = isSearching || currentChapter === 'all';
            
            const groupedData = data.reduce((acc, item) => {
                // 전체 보기일 때는 섹션 앞에 [CH 번호] 를 달아서 구분을 명확히 해줍니다.
                const groupKey = isAllOrSearch 
                    ? `[CH ${String(item.chapter).padStart(2, '0')}] ${item.section}` 
                    : item.section;
                    
                if (!acc[groupKey]) acc[groupKey] = [];
                acc[groupKey].push(item);
                return acc;
            }, {});

            // HTML 생성
            let contentHtml = '';
            for (const [groupKey, prompts] of Object.entries(groupedData)) {
                // 섹션 아코디언 헤더
                const sectionId = 'sec-' + Math.random().toString(36).substr(2, 9);
                
                // 검색어 하이라이트 적용 전, "[CH 00]" 패턴이 있으면 예쁘게 색상을 입혀줍니다.
                let displaySectionTitle = highlightText(groupKey, searchQuery);
                if(isAllOrSearch && groupKey.startsWith('[CH')) {
                     displaySectionTitle = displaySectionTitle.replace(/\[CH (\d+)\]/, '<span class="text-white font-black mr-2 bg-netflix-red rounded px-2 py-0.5 text-[11px] align-middle inline-block mb-1 shadow-md">CH $1</span>');
                }

                contentHtml += `
                    <div class="mb-12">
                        <button onclick="toggleAccordion('${sectionId}', this)" class="w-full flex items-center justify-between text-left group py-2">
                            <h3 class="text-lg font-bold text-gray-200 group-hover:text-white transition-colors flex-1 tracking-tight break-keep leading-snug drop-shadow-sm">${displaySectionTitle}</h3>
                            <i data-lucide="chevron-up" class="w-5 h-5 text-gray-500 group-hover:text-netflix-red icon-transition ml-4 flex-shrink-0"></i>
                        </button>
                        <div id="${sectionId}" class="accordion-content expanded mt-5 space-y-6">
                `;

                // 프롬프트 카드 렌더링 (넷플릭스 스타일)
                prompts.forEach(prompt => {
                    contentHtml += `
                        <div class="bg-[#1a1a1a] rounded-lg border border-gray-800/80 overflow-hidden hover:border-netflix-red/50 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_8px_30px_rgba(229,9,20,0.12)]">
                            <div class="p-6 md:p-7">
                                <div class="flex items-start gap-4 mb-5">
                                    <span class="flex-shrink-0 flex items-center justify-center w-7 h-7 rounded-full bg-gradient-to-br from-netflix-red to-red-800 text-white font-black text-xs shadow-md border border-red-500/30">${prompt.number}</span>
                                    <div class="flex-grow">
                                        <h4 class="text-base font-bold text-gray-100 leading-tight tracking-wide break-keep">${highlightText(prompt.title, searchQuery)}</h4>
                                        <p class="text-sm text-gray-400 font-medium mt-2 break-keep leading-relaxed">${highlightText(prompt.context, searchQuery)}</p>
                                    </div>
                                </div>
                                <div class="relative bg-[#0a0a0a] border-l-[3px] border-netflix-red rounded-r-lg p-5 mt-5 shadow-inner">
                                    <button onclick="copyToClipboard(this, '${prompt.id}')" class="absolute top-4 right-4 text-[11px] font-bold tracking-wider bg-[#1f1f1f] border border-gray-700 text-gray-300 hover:text-white hover:bg-netflix-red hover:border-netflix-red px-3 py-1.5 rounded flex items-center gap-1.5 transition-all duration-200 focus:outline-none z-10 hover:shadow-lg">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                        <span>복사</span>
                                    </button>
                                    <div class="prompt-box text-[14px] text-gray-300 font-medium leading-loose pr-20">${highlightText(prompt.prompt, searchQuery)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                contentHtml += `
                        </div>
                    </div>
                `;
            }

            container.insertAdjacentHTML('beforeend', contentHtml);
            lucide.createIcons();
        }

        // 아코디언 토글 기능
        window.toggleAccordion = function(sectionId, btnElement) {
            const content = document.getElementById(sectionId);
            const icon = btnElement.querySelector('i');
            
            if (content.classList.contains('expanded')) {
                content.classList.replace('expanded', 'collapsed');
                icon.classList.add('rotate-180');
            } else {
                content.classList.replace('collapsed', 'expanded');
                icon.classList.remove('rotate-180');
            }
        };

        // 클립보드 복사 기능 (개선됨: fallback 로직 강화 및 에러 토스트 적용)
        window.copyToClipboard = async function(btnElement, promptId) {
            const promptItem = promptData.find(item => item.id === promptId);
            if (!promptItem) {
                showToast("데이터를 찾을 수 없습니다.", true);
                return;
            }
            
            const textToCopy = promptItem.prompt;
            const originalHTML = btnElement.innerHTML;
            let copySuccess = false;
            
            try {
                // 1차 시도: Clipboard API (모바일/최신 브라우저 지원)
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(textToCopy);
                    copySuccess = true;
                } else {
                    throw new Error("Clipboard API not available");
                }
            } catch (err) {
                // 2차 시도 (Fallback): iFrame이나 구형 환경을 위한 execCommand 방식
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                // 화면 스크롤이 튀지 않도록 fixed 사용
                textArea.style.position = "fixed"; 
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    copySuccess = document.execCommand('copy');
                } catch (fallbackErr) {
                    console.error("Fallback copy failed", fallbackErr);
                }
                document.body.removeChild(textArea);
            }

            if (copySuccess) {
                // 성공 시 버튼 상태 변경
                btnElement.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i><span class="text-white">복사됨 ✓</span>`;
                btnElement.classList.add('border-netflix-red', 'bg-netflix-red');
                btnElement.classList.remove('border-gray-700', 'bg-[#1f1f1f]', 'text-gray-300');
                lucide.createIcons();

                showToast("클립보드에 복사되었습니다.", false);

                // 2초 후 버튼 원상 복구
                setTimeout(() => {
                    btnElement.innerHTML = originalHTML;
                    btnElement.classList.remove('border-netflix-red', 'bg-netflix-red');
                    btnElement.classList.add('border-gray-700', 'bg-[#1f1f1f]', 'text-gray-300');
                    lucide.createIcons();
                }, 2000);
            } else {
                // 실패 시 에러 토스트 (alert 사용 안 함)
                showToast("복사에 실패했습니다. 기기의 설정(클립보드 권한)을 확인해주세요.", true);
            }
        };

        // 토스트 메시지 표시 (성공/에러 상태 구분)
        let toastTimeout;
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.innerText = message;
            
            if (isError) {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.classList.replace('text-netflix-red', 'text-yellow-500');
            } else {
                toastIcon.setAttribute('data-lucide', 'check-circle-2');
                toastIcon.classList.replace('text-yellow-500', 'text-netflix-red');
            }
            lucide.createIcons();

            toast.classList.remove('toast-exit', 'hidden');
            clearTimeout(toastTimeout);
            toast.classList.add('toast-enter');
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
            }, 2500);
        }
    </script>
</body>
</html>
